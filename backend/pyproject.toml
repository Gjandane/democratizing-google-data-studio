[project]
name = "dss-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "sse-starlette>=2.1",
  "python-multipart>=0.0.9", "google-adk>=2.0,<3", "google-genai>=1.0",
  "google-cloud-bigquery>=3.25", "python-dotenv>=1.0", "pydantic>=2.8",
  "pyyaml>=6.0", "jsonschema>=4.23", "playwright>=1.48", "jsonpatch>=1.33",
  "httpx>=0.27", "google-auth[requests]>=2.30", "pytest>=8.0", "pytest-asyncio>=0.23",
]

[project.scripts]
dss-agent = "dss.agent.client:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
markers = ["live: explicitly enabled tests using real external services"]
